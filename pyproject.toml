[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genim"
version = "0.4.0"
description = "Multi-backend, symmetry-aware crystal generation toolkit for general materials chemistry."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["materials-science", "crystal-structure", "generative-model", "symmetry", "ase"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "ase>=3.26.0",
  "matplotlib>=3.7",
  "numpy>=1.23",
  "Pillow>=10.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "spglib>=2.2",
  "torch>=2.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# MLIP relax backend (OMAT24 eSEN via fairchem-core)
mlip = [
  "fairchem-core",
  "huggingface-hub",
]
# Energy Above Hull (convex hull utilities)
hull = [
  "pymatgen",
  "scipy",
]
# Matra itself is installed separately from its approved source because its
# non-commercial research license differs from GenIM's BSD license.
matra = [
  "pymatgen>=2024.1",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
all = [
  "fastapi>=0.115,<1",
  "fairchem-core",
  "huggingface-hub",
  "pymatgen",
  "scipy",
  "uvicorn[standard]>=0.30,<1",
]
test = [
  "httpx>=0.27",
  "pytest>=7.4",
]

[project.urls]
Homepage = "https://github.com/XYG-Research/GenIM"
Repository = "https://github.com/XYG-Research/GenIM"
Issues = "https://github.com/XYG-Research/GenIM/issues"

[project.scripts]
genim = "genim.cli:main"
genim-api = "genim.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
