name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[hull,test]"
      - name: Test
        run: python -m pytest -q
      - name: Compile public package
        run: python -m compileall -q src/genim
      - name: Build source and wheel distributions
        if: matrix.python-version == '3.11'
        run: python -m build
