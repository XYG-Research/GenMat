name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[hull,test]"
      - name: Test
        run: python -m pytest -q
      - name: Verify canonical and compatibility namespaces
        run: |
          python -m compileall -q src/genmat src/genim
          python -c "import genmat, genim; assert genmat.GenMat is genim.GenMat; assert genmat.__version__ == '0.6.0'"
          genmat models list
          genim --help
      - name: Build source and wheel distributions
        if: matrix.python-version == '3.11'
        run: python -m build
